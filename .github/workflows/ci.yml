name: Build, test, and preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, MIT
      - name: Verify generated project and repository
        run: |
          python3 scripts/check_repository.py
          python3 scripts/generate_project.py
          git diff --exit-code
      - name: Test shared drawing algorithms
        run: swift test
      - name: Test preview publishing safeguards
        run: python3 -m unittest discover -s Tests/AutomationTests
      - name: Build and test native macOS app
        run: >-
          xcodebuild test -project SumiPaint.xcodeproj -scheme SumiPaint-macOS
          -destination 'platform=macOS' -derivedDataPath build/macOS
          -resultBundlePath build/macOS-results.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Build universal macOS preview
        run: >-
          xcodebuild build -project SumiPaint.xcodeproj -scheme SumiPaint-macOS
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build/macOS-preview ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO
          CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO
      - name: Sign and verify local macOS preview
        run: |
          app='build/macOS-preview/Build/Products/Release/Sumi Paint.app'
          codesign --force --sign - --options runtime --entitlements App/macOS.entitlements "$app"
          codesign --verify --deep --strict "$app"
          python3 scripts/package_preview.py macOS "$app"
          ditto -x -k build/preview/SumiPaint-macOS-Preview.zip build/preview-check
          python3 scripts/macos_smoke.py 'build/preview-check/SumiPaint-macOS-Preview/Sumi Paint.app'
      - name: Upload macOS preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, MIT
        with:
          name: preview-macOS
          path: build/preview/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, MIT
        with:
          name: macOS-test-results
          path: build/macOS-results.xcresult
          if-no-files-found: ignore
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, MIT
      - name: Build iPhone and iPad app
        run: >-
          xcodebuild build -project SumiPaint.xcodeproj -scheme SumiPaint-iOS
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/iOS
          -configuration Release ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO
          CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO
      - name: Launch on iPhone and iPad simulators
        run: python3 scripts/simulator_smoke.py 'build/iOS/Build/Products/Release-iphonesimulator/Sumi Paint.app'
      - name: Package iOS simulator preview
        run: python3 scripts/package_preview.py iOS-simulator 'build/iOS/Build/Products/Release-iphonesimulator/Sumi Paint.app'
      - name: Upload iOS simulator preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, MIT
        with:
          name: preview-iOS-simulator
          path: build/preview/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, MIT
        with:
          name: simulator-screenshots
          path: build/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 30
  publish-preview:
    needs: [macos, ios]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, MIT
      - name: Download app packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0, MIT
        with:
          pattern: preview-*
          merge-multiple: true
          path: build/preview
      - name: Download screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0, MIT
        with:
          name: simulator-screenshots
          path: build/preview
      - name: Publish verified preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_preview.py build/preview
